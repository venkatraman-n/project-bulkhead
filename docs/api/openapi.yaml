openapi: 3.0.3
info:
  title: Project Bulkhead - fraud screening API
  version: 1.0.0
  license:
    name: Proprietary
  description: |
    Real-time screening for bank payment switches, and decision explanations for investigators.
    Every path is scoped by tenant. Errors use RFC 9457 problem+json with a stable `code`.
    Checked against the running code by src/test/java/com/azentio/bulkhead/api/OpenApiContractTest.java.
servers:
  - url: http://localhost:8080
security:
  - switchToken: []
paths:
  /v1/tenants/{tenantId}/screenings:
    post:
      operationId: screenTransaction
      summary: Screen a payment before authorisation (idempotent per tenant + transactionId)
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreeningRequest'
      responses:
        '200':
          description: Decision. A retry with the same payload returns the original decision.
          headers:
            Idempotent-Replayed:
              description: "true when this response replays an earlier decision"
              schema:
                type: string
                enum: ['true', 'false']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreeningResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          description: Unknown tenant (code UNKNOWN_TENANT)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Same transactionId already screened or being screened with a different payload (IDEMPOTENCY_CONFLICT), or a concurrent duplicate still in progress (SCREENING_IN_PROGRESS, retry)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Tenant rule pack invalid (TENANT_CONFIG_INVALID) or system of record unavailable (SYSTEM_OF_RECORD_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/tenants/{tenantId}/screenings/{transactionId}:
    get:
      operationId: explainScreening
      summary: Decision explanation for investigators (account token masked)
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Explanation of the stored decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreeningExplanation'
        '404':
          description: Unknown tenant (UNKNOWN_TENANT) or no such transaction for this tenant (SCREENING_NOT_FOUND). Another tenant's transaction is also 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    switchToken:
      type: http
      scheme: bearer
      description: Per-bank credential validated at the API gateway (mTLS + token); not enforced by the walking skeleton.
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,31}$'
        example: bank-a
  responses:
    Problem:
      description: Validation or malformed request (VALIDATION_FAILED, MALFORMED_REQUEST, TIMESTAMP_IN_FUTURE)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Decision:
      type: string
      enum: [APPROVE, REVIEW, DECLINE]
    ScreeningRequest:
      type: object
      additionalProperties: false
      required: [transactionId, accountToken, amount, currency, country, timestamp]
      properties:
        transactionId: { type: string, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$' }
        accountToken: { type: string, minLength: 4, maxLength: 100, description: 'Token issued by the switch, never a raw card number' }
        amount: { type: number, minimum: 0.01 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        merchantCategory: { type: string, pattern: '^[0-9]{4}$' }
        beneficiaryId: { type: string, maxLength: 100 }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        timestamp: { type: string, format: date-time }
    ScreeningResponse:
      type: object
      additionalProperties: false
      required: [tenantId, transactionId, decision, riskScore, reasonCodes, degraded, missingFeatures, rulePackVersion, evaluationMs]
      properties:
        tenantId: { type: string }
        transactionId: { type: string }
        decision: { $ref: '#/components/schemas/Decision' }
        riskScore: { type: integer, minimum: 0, maximum: 100 }
        reasonCodes: { type: array, items: { type: string } }
        degraded: { type: boolean, description: true when some features were unavailable and the tenant policy applied }
        missingFeatures: { type: array, items: { type: string, enum: [velocity, newBeneficiary] } }
        rulePackVersion: { type: string }
        evaluationMs: { type: integer, minimum: 0 }
    RuleResult:
      type: object
      additionalProperties: false
      required: [rule, fired, skipped, threshold, observed, points]
      properties:
        rule: { type: string, example: VELOCITY_10M }
        fired: { type: boolean }
        skipped: { type: boolean, description: rule could not run because its feature was unavailable }
        threshold: { type: string, example: "> 5 in PT10M" }
        observed: { type: string, example: "6" }
        points: { type: integer, minimum: 0, maximum: 100 }
    ScreeningExplanation:
      type: object
      additionalProperties: false
      required: [tenantId, transactionId, accountToken, amount, currency, country, decision, riskScore, reasonCodes,
                 rules, degraded, missingFeatures, rulePackVersion, transactionTimestamp, screenedAt, evaluationMs]
      properties:
        tenantId: { type: string }
        transactionId: { type: string }
        accountToken: { type: string, pattern: '^\*{4}.{0,4}$', description: Masked to the last 4 characters }
        amount: { type: number }
        currency: { type: string }
        merchantCategory: { type: string, nullable: true }
        beneficiaryId: { type: string, nullable: true }
        country: { type: string }
        decision: { $ref: '#/components/schemas/Decision' }
        riskScore: { type: integer, minimum: 0, maximum: 100 }
        reasonCodes: { type: array, items: { type: string } }
        rules: { type: array, items: { $ref: '#/components/schemas/RuleResult' } }
        degraded: { type: boolean }
        missingFeatures: { type: array, items: { type: string } }
        rulePackVersion: { type: string }
        transactionTimestamp: { type: string, format: date-time }
        screenedAt: { type: string, format: date-time }
        evaluationMs: { type: integer, minimum: 0 }
    Problem:
      type: object
      required: [status, title, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum: [VALIDATION_FAILED, MALFORMED_REQUEST, TIMESTAMP_IN_FUTURE, UNKNOWN_TENANT, IDEMPOTENCY_CONFLICT,
                 SCREENING_IN_PROGRESS, SCREENING_NOT_FOUND, TENANT_CONFIG_INVALID, SYSTEM_OF_RECORD_UNAVAILABLE,
                 HTTP_ERROR, INTERNAL_ERROR]
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
